<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body style="background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif;">
    <div style="max-width: 500px; width: 90%; background: #ffffff; border-radius: 16px; padding: 40px; text-align: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); border: 1px solid #e2e8f0;">
        <div style="font-size: 56px; margin-bottom: 12px;">⚠️</div>
        <h1 style="font-size: 24px; font-weight: 700; color: #1e293b; margin: 0 0 8px 0;">Internal Server Error</h1>
        <p style="color: #64748b; font-size: 14px; margin: 0 0 24px 0;">Something went wrong on the server while processing your request.</p>
        
        {% if error %}
        <div style="background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 12px; font-family: monospace; text-align: left; word-break: break-all; margin-bottom: 24px;">
            {{ error }}
        </div>
        {% endif %}

        <div style="display: flex; gap: 12px; justify-content: center;">
            <a href="/" style="display: inline-block; padding: 10px 20px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px;">Return Home</a>
            <a href="/health" style="display: inline-block; padding: 10px 20px; background: #f1f5f9; color: #475569; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 14px;">Check Health</a>
        </div>
    </div>
</body>
</html>
