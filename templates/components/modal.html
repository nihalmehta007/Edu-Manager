<!-- Modal Component Macro -->
{% macro modal(id, title) %}
<div class="modal-backdrop" id="{{ id }}">
    <div class="modal">
        <div class="modal-header">
            <h3>{{ title }}</h3>
            <button class="modal-close" onclick="closeModal('{{ id }}')">&times;</button>
        </div>
        <div class="modal-body">
            {{ caller() }}
        </div>
    </div>
</div>
{% endmacro %}
